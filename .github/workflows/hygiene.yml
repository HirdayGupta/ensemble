# Checks on the repository itself rather than the app: workflow security (zizmor), action pins (pinact), and a
# secrets scan over the whole history, plus the website logic tests. The same zizmor and gitleaks versions run locally through .pre-commit-config.yaml.
name: hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: hygiene-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks-action reads pull request metadata to report what it finds.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secrets scan covers the whole history, not the working tree.
          fetch-depth: 0
          persist-credentials: false

      # The three checks below each run even when an earlier one failed, so one run reports every finding.
      - name: Audit workflows and dependabot.yml
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

      # Every `uses:` must be a full commit SHA, and that SHA must be the commit the trailing version comment names.
      # fix "false" only checks; it never rewrites a workflow file or pushes.
      - name: Verify actions are pinned
        if: ${{ !cancelled() }}
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"
          skip_push: "true"

      - name: Secrets scan
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  website-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Website logic tests
        run: node --test docs/live/test/logic.test.mjs
