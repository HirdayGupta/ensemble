# Release pipeline. Runs only when a tag named v* is pushed (for example v0.1.0); nothing else triggers it.
# One-time setup, secrets and the steps to cut a release: docs/RELEASING.md.
#
# Repository secrets used:
#   DEVELOPER_ID_P12_BASE64     base64 of the exported "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD   password chosen when exporting the .p12
#   NOTARY_KEY_P8               full text of the App Store Connect API key file (AuthKey_XXXX.p8)
#   NOTARY_KEY_ID               the key's ID
#   NOTARY_ISSUER_ID            the issuer ID shown above the key list in App Store Connect
#   SPARKLE_ED_PRIVATE_KEY      output of Sparkle's generate_keys -x (the update signing key)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the build number is the commit count, which Sparkle needs to grow every release

      - name: Check that the release is configured
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::repository secret $name is not set (docs/RELEASING.md)"; missing=1; fi
          done
          if grep -q "TODO-REPLACE-WITH-SPARKLE-PUBLIC-ED-KEY" Sources/Ensemble/Info.plist; then
            echo "::error::SUPublicEDKey in Sources/Ensemble/Info.plist is still the placeholder"; missing=1
          fi
          if grep -q 'feedURL = "https://OWNER' Sources/Ensemble/App/UpdateController.swift; then
            echo "::error::UpdateConfig.feedURL in UpdateController.swift still has OWNER/REPO"; missing=1
          fi
          exit $missing

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release 2>&1 | tee /tmp/ensemble-ci-build.log

      - name: Test
        run: swift test 2>&1 | tee /tmp/ensemble-ci-test.log

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ensemble-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the imported certificate"; exit 1; }
          echo "ENSEMBLE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign, notarize and package (scripts/release.sh)
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          (umask 077; printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8")
          export ENSEMBLE_NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          export ENSEMBLE_NOTARY_KEY_ID="$NOTARY_KEY_ID"
          export ENSEMBLE_NOTARY_ISSUER="$NOTARY_ISSUER_ID"
          export ENSEMBLE_VERSION="${VERSION#v}"
          scripts/release.sh
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Ensemble-*.dmg
            build/Ensemble-*.dmg.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Pre-release tags (v0.2.0-beta.1) are published but never offered to existing users.
      - name: Check out the appcast branch
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - name: Update the appcast
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          export ENSEMBLE_DOWNLOAD_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/"
          scripts/appcast.sh "build/Ensemble-${VERSION#v}.dmg" pages
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Appcast: ${VERSION}"
          git push origin HEAD:gh-pages

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-logs
          path: |
            /tmp/ensemble-ci-*.log
            /tmp/ensemble-release.log
            /tmp/ensemble-bundle.log
          if-no-files-found: ignore

      - name: Remove the temporary keychain and key
        if: ${{ always() }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"
