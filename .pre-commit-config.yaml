# Run before pushing: pre-commit run --all-files
# Unset the token variables first so a placeholder token never reaches zizmor's online audits:
#   env -u GH_TOKEN -u GITHUB_TOKEN pre-commit run --all-files
# CI runs the same two tools in .github/workflows/hygiene.yml. Revisions are commit SHAs, with the tag as a comment.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
